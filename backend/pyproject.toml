[project]
name = "zoqari-signal-backend"
version = "0.1.0"
description = "Backend API for Zoqari Signal"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "argon2-cffi>=23.1,<26",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "openai>=1.68,<3",
    "mutagen>=1.47,<2",
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
    "stripe>=14.4,<15",
    "openpyxl>=3.1,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]